# Dependency updates.
#
# Monthly rather than weekly: this is a small dependency surface and a stream
# of single-bump pull requests is the fastest way to teach people to ignore
# them. Patch and minor updates are grouped into one pull request per ecosystem
# for the same reason — CI either goes green on the group or it does not.
# Majors stay separate, because those are the ones worth reading.
#
# Commit messages are prefixed to match the Conventional Commits convention
# CONTRIBUTING.md documents, so Dependabot's history reads like everyone else's.
version: 2

updates:
  # Go modules. `gomod` covers go.mod at the repository root; there is only one
  # module here (the console and pkg/configclient live inside it).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The React console. Note the directory: package.json is in webui/, not at
  # the root.
  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # ESLint and everything that peer-depends on it, across every update type
      # including major. Dependabot assigns a dependency to the first group it
      # matches, so this has to sit above the catch-all below.
      #
      # Raised because eslint 9 to 10 arrived as three separate pull requests —
      # eslint, @eslint/js and eslint-plugin-react-hooks — and every one of them
      # failed at `npm ci`, because eslint-plugin-react still peer-refuses 10.
      # No ordering of those merges works: the blocker is a fourth package that
      # none of them touch. A plugin ecosystem only moves as a set, so it has to
      # be offered as one.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "@eslint-community/*"
          - "eslint-plugin-*"
          - "eslint-config-*"
          - "globals"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Base images in the root Dockerfile: golang, node, and the two distroless
  # runtime stages.
  #
  # deploy/compose/docker-compose.yml pins nats:2.10-alpine and is NOT covered
  # here — the `docker` ecosystem tracks Dockerfiles, and Compose manifests are
  # a separate ecosystem. That one image is reviewed by hand; JetStream is the
  # distribution plane, so its version is a deliberate choice rather than
  # something to take automatically.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The actions used by the workflows in .github/workflows/. These are pinned
  # by major tag, so this mostly surfaces the major bumps that need a look.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
