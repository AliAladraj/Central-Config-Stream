# What a `v*` tag turns into: a GitHub release carrying cross-compiled binaries
# and checksums, and a container image on GHCR. Nothing else publishes anything,
# and nothing publishes without the gate below passing first.
name: Release

on:
  push:
    tags: ['v*']

# Nothing is granted workflow-wide. The only two writes this repository ever
# needs are `contents` for the release and its assets and `packages` for the
# GHCR push, and they are declared on the one job that performs each — a
# workflow that can write the repository is one stolen action away from being
# able to rewrite it, and the gate below runs the most third-party code of the
# three while needing to write nothing at all. No job here reads an issue, a
# check or a pull request either.

# Grouped like ci.yml, but without cancel-in-progress. A tag is pushed once and
# the group will almost never have two members; if it somehow does, cancelling
# the first run mid-upload leaves a half-populated release behind, which is
# worse than two runs racing to produce identical artefacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ci.yml already runs this on every pull request, and it runs again here on
  # purpose. A tag is a ref like any other: it can be pushed at any commit,
  # including one that never opened a pull request, one on a branch that was
  # force-pushed after its green tick, or one that passed before an unrelated
  # dependency bump changed what `go build` resolves. The green tick is a fact
  # about a commit at a moment; a release has to be a fact about the artefact
  # being published now.
  #
  # And the two failures cost differently. A red CI run is a re-push. A bad
  # release is a GitHub asset with a checksum, a GHCR tag people have already
  # pulled, and a version number that can never be reused — so the gate is a
  # precondition of publishing rather than a lookup of previous history.
  #
  # This is the Go half of ci.yml, not all of it. gofmt, golangci-lint and the
  # JS suite guard how the source reads, and their opinion of a commit that is
  # already tagged changes nothing about whether the binary is correct; build,
  # vet and test are what decide whether the artefact works — together with the
  # database those tests need, which is why the service container below is
  # copied from ci.yml rather than treated as a CI-only luxury.
  gate:
    name: build, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Read-only: this job publishes nothing. The two write scopes live on the
    # jobs below that actually need them.
    permissions:
      contents: read

    # The same container ci.yml stands up, for the same reason and pinned to the
    # same tag. Without it internal/pgintegration skips every test and reports
    # ok, so a gate that is meant to decide whether an artefact works would sign
    # off on a tree whose production storage path was never executed.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: central_config_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d central_config_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Spelled exactly as in ci.yml, 127.0.0.1 included: the service port is
      # published on the runner's IPv4 loopback only.
      TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/central_config_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      # ci.yml carries this step and explains why at length: the integration
      # suite fails open, so a typo'd DSN or an unhealthy container leaves the
      # step above green while testing nothing. That matters more here than
      # there — this is the run that decides whether a version number gets
      # spent.
      - name: the Postgres suite ran rather than skipped
        run: |
          set -eo pipefail
          log="$RUNNER_TEMP/pgintegration.log"
          go test -count=1 -v ./internal/pgintegration/ | tee "$log"
          if grep -q '^--- SKIP' "$log"; then
            echo "::error::The PostgreSQL integration suite skipped. TEST_POSTGRES_DSN did not reach the service container."
            grep '^--- SKIP' "$log"
            exit 1
          fi
          echo "ran $(grep -c '^--- PASS' "$log") PostgreSQL integration tests against a live server"

  binaries:
    name: binaries and release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The release and its assets. No `packages` — this job never touches GHCR.
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 rather than the default shallow clone. GoReleaser derives
      # the version from the tag history — `git describe` needs the tags and the
      # commits between them — and a depth-1 checkout has neither.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # CHANGELOG.md is already the answer to "what changed", written as
      # capability rather than commit history, so the release page quotes it
      # instead of holding a second, worse version of it. The heading match is
      # anchored on `## [x.y.z]` and nothing after it, because the rest of the
      # line changes as a release is cut: it reads `— UNRELEASED — tag pending`
      # while the version is still being assembled and carries a date once it
      # is finalised.
      #
      # An empty section fails the job. Tagging without writing the changelog
      # entry is the mistake this is here to catch — it is silent otherwise, and
      # the result is a release page that says nothing at all.
      - name: Extract this tag's release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          file="${RUNNER_TEMP}/release-notes.md"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$file"
          if ! grep -q '[^[:space:]]' "$file"; then
            echo "::error::CHANGELOG.md has no '## [$version]' section. Add one before tagging — see docs/RELEASING.md."
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "Release notes for $version:"
          cat "$file"

      # Pinned exactly, for the reason ci.yml pins golangci-lint: GoReleaser
      # changes what it produces between minor versions — archive naming and
      # config keys have both moved under v2 — and that should turn this job red
      # on the commit that bumps this line rather than on whichever tag happens
      # to be cut next.
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.17.1
          args: release --clean --release-notes=${{ steps.notes.outputs.file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: image to GHCR
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # `packages` for the GHCR push, `contents: read` because the checkout below
    # needs it once the workflow-wide default is gone. No `contents: write` —
    # this job never touches the release.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # The same three values the Makefile computes, spelled the same way, so an
      # image and a `make build` binary of the same commit report the same
      # thing. VERSION is the tag rather than `git describe` because on the
      # tagged commit those are equal and github.ref_name needs no git at all.
      - name: Build identity
        id: identity
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Lowercase, because GHCR requires it and the repository is not:
      # ghcr.io/erasedkyte/central-config, from ErasedKyte/Central-Config-Stream.
      #
      # `latest` comes from the default latest=auto: a plain vX.Y.Z moves it, a
      # pre-release tag like v0.2.0-rc.1 does not. That is the same question
      # .goreleaser.yaml's `prerelease: auto` asks, answered from the same tag,
      # so the release page and the registry cannot disagree about what is
      # current.
      #
      # No bare `{{major}}` tag. At 0.x a major-only tag would be `0`, and
      # SemVer makes no compatibility promise across 0.y releases, so a `0` tag
      # that silently moves from 0.1 to 0.2 promises something this project has
      # not earned yet.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/erasedkyte/central-config
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # `target: central-config` names the stage rather than relying on it being
      # last in the Dockerfile, so a stage appended later cannot quietly change
      # what gets published under this name.
      #
      # That stage is the service and nothing else. The Dockerfile's separate
      # `testconsole` stage is the one that copies the compiled React bundle out
      # of the Node stage; it is a local harness, it is never deployed, and it
      # is not pushed here. Nothing in this image serves a browser UI.
      #
      # linux/amd64 only. The Dockerfile's build stage compiles in-image without
      # a $BUILDPLATFORM/$TARGETARCH split, so asking buildx for linux/arm64
      # would run the whole Go build under QEMU emulation for every release.
      # Making it cross-compile properly is a Dockerfile change, not a workflow
      # one; until then arm64 is served by the release binaries above, which are
      # genuinely cross-compiled because CGO is out of the picture.
      #
      # metadata-action's labels are applied with --label, which takes
      # precedence over the Dockerfile's own LABEL lines, and three of them
      # disagree with what the binary inside the image prints: version would be
      # `0.1.0` where `--version` says `v0.1.0`, revision the full 40-char sha
      # where the binary says the 7-char short one, and title
      # `Central-Config-Stream` — the repository — overwriting the Dockerfile's
      # deliberate `central-config`, which is the name .goreleaser.yaml builds
      # every archive from and the name people actually type.
      #
      # docs/RELEASING.md tells operators to read the labels as confirmation of
      # what they pulled, so those three are restated here from the same values
      # the build-args below stamp into the binary. Repeating a label makes the
      # last --label win (true of both the classic builder and buildx), so these
      # override metadata-action's while its other labels — created, source,
      # url, description — pass through untouched. The Dockerfile's LABEL lines
      # stay as they are: they are what a plain `docker build .` on a laptop
      # produces, and this workflow is not the only way an image gets built.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: central-config
          # Both architectures anyone actually runs this on: an amd64 node and
          # an ARM one (Graviton, an M-series laptop). Published as a single
          # manifest list, so `docker pull` resolves the right image without the
          # caller naming a platform — which they had to before, and which
          # failed outright on ARM rather than degrading.
          #
          # This costs almost nothing because the Dockerfile cross-compiles:
          # the build stage is pinned to $BUILDPLATFORM and Go is told the
          # target through TARGETOS/TARGETARCH. Emulating an arm64 toolchain
          # under QEMU instead would be minutes per release for an identical
          # binary.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.title=central-config
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ steps.identity.outputs.commit }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.identity.outputs.commit }}
            DATE=${{ steps.identity.outputs.date }}
